version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ora-ai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ora-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ora-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./dental_ai.db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    networks:
      - ora-network

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: ora-ai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ai-ora
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key}
      - PREDICT_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGIN=*
    depends_on:
      - mongodb
      - ai-service
    networks:
      - ora-network

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: ora-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
    depends_on:
      - backend
    networks:
      - ora-network

networks:
  ora-network:
    driver: bridge

volumes:
  mongo_data:
